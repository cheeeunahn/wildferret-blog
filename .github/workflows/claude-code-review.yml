name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required so Claude can post its review comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the review can diff against the base branch and read
          # surrounding context, not just the PR's tip commit
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Run `/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment`
            to review this pull request thoroughly. The `--comment` flag makes the
            review post each finding as an inline comment anchored to its line in
            the Files changed tab.

            Before judging any changed hunk, read the full file it lives in and the
            files it calls into, so findings are grounded in how the code is actually
            used rather than in the diff alone. Read CLAUDE.md and follow the project
            conventions it documents (asset URLs via `resolveAssetUrl`, the ink/paper
            Tailwind token scale, the article content format).

            Cover, in this order of priority:
            1. Correctness — logic errors, unhandled edge cases, null/undefined paths,
               async and state-update races, incorrect types behind `any` or casts
            2. Regressions — behavior this PR changes for existing routes, articles,
               or the GitHub Pages base-path handling
            3. Project conventions — violations of the rules in CLAUDE.md
            4. Security — XSS via rendered content, unsafe URL handling, dependency risk
            5. Performance — unnecessary re-renders, work repeated per render, bundle cost
            6. Maintainability — duplicated logic, dead code, naming, missing error states

            For every finding give: the `file:line`, what is wrong, a concrete scenario
            in which it produces the wrong result, and a suggested fix as a code block.
            Skip nitpicks that do not change behavior, readability, or safety — depth
            means well-evidenced findings, not a longer list.

            If `--comment` fails to place a finding inline — GitHub only accepts
            comments on lines that appear in the diff — post that finding as an
            inline comment on the nearest changed line in the same file and say
            which line it really refers to. If it cannot be anchored at all, carry
            it into the summary comment below instead of dropping it.

            Then post one summary comment on the PR using:
            `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file <path>`
            (write the body to a file first so markdown and backticks survive intact).

            Structure that summary as:
            - **Summary** — a short paragraph on what the PR does and its overall state
            - **Findings** — a one-line-per-finding index (`file:line` + severity +
              a few words), since the detail already lives in the inline comments.
              Full explanation and suggested fix inline here only for findings that
              could not be anchored to a line
            - **What looks good** — one or two lines, so the review is not only negative

            If you found nothing worth changing, skip the inline comments and leave
            only the summary, saying the PR looks good and what you checked. Never
            leave more than one summary comment.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: >-
            --allowed-tools "Read,Grep,Glob,Write,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*)"
            --max-turns 80
