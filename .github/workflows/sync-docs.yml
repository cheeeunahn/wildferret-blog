name: Sync README and CLAUDE.md

# README.md and CLAUDE.md describe the repo's structure: its files, scripts,
# islands and external hosts. This keeps them true. It runs on any push that
# could change that structure, and updates both docs when it did.
#
# The decision is NOT made by the model: scripts/docs-sync.mjs compares the repo
# with the shape recorded in docs/docs-sync.snapshot.json, and Claude only runs
# if something changed (or a generated block has an entry with no prose). Most
# pushes stop at step 1. Unreviewed docs are a valid state, so this workflow
# never fails a build over them.
#
# Loop safety: the commit this workflow pushes uses GITHUB_TOKEN, and pushes
# made with GITHUB_TOKEN do not trigger workflows. The scan is a second guard:
# /sync-docs ends with --accept, so a re-run finds nothing and exits at step 1.

on:
  push:
    paths-ignore:
      # Content and generated files say nothing about the repo's structure.
      - 'src/data/article-content/**'
      - 'public/assets/**'
      - 'docs/sbom/**'
    branches-ignore:
      - 'docs-sync/**'
      - 'translate/**'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional area to focus the review on (a file or feature)'
        required: false
        default: ''

concurrency:
  # One docs run per branch; a newer push supersedes an in-flight one.
  group: sync-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the doc update back
      pull-requests: write # opens the PR when the push was to main
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether the docs still match the repo
        id: status
        run: |
          node scripts/docs-sync.mjs || true
          # Exit 1 means a stale block or a missing marker. Both are work for
          # /sync-docs, not a reason to fail the job, so keep the code off the
          # pipeline (a step's default shell runs with -e and pipefail).
          node scripts/docs-sync.mjs --json > "$RUNNER_TEMP/docs.json" || true
          work=$(jq '(.changes | length) + (.unnoted | length) + (.stale | length) + (.problems | length)' "$RUNNER_TEMP/docs.json")
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Update the docs
        if: steps.status.outputs.work != '0' || github.event.inputs.focus != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run `/sync-docs ${{ github.event.inputs.focus }}`.

            Follow that command's instructions exactly. It is the single source
            of truth for how this repo keeps README.md and CLAUDE.md current,
            and it is the same procedure a human runs locally.

            Edit and verify the files. Do not commit, push, or open a pull
            request: a later step in this workflow does that, so leave your work
            in the working tree.

            Finish by writing your summary (the edits, then a "Needs a human"
            list) to `/tmp/docs-sync-summary.md`. Write that file even if the
            list is empty.
          claude_args: >-
            --allowed-tools "Read,Edit,Grep,Glob,Bash(node scripts/docs-sync.mjs:*),Bash(pnpm exec prettier:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --max-turns 80

      - name: Commit the doc update
        if: steps.status.outputs.work != '0' || github.event.inputs.focus != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Only ever the two docs and the snapshot. Never code, and never a
          # file the run happened to touch.
          git add README.md CLAUDE.md docs/docs-sync.snapshot.json
          if git diff --cached --quiet; then
            echo 'Nothing was produced — leaving the branch untouched.'
            exit 0
          fi

          git commit \
            -m 'docs: sync README.md and CLAUDE.md with the repo' \
            -m 'Generated by .github/workflows/sync-docs.yml.' \
            -m 'Co-Authored-By: Claude <noreply@anthropic.com>'

          summary=/tmp/docs-sync-summary.md
          [ -f "$summary" ] || echo 'No summary was written.' > "$summary"

          if [ "${{ github.ref_name }}" = 'main' ]; then
            # main is protected, so the update arrives as a reviewable PR.
            branch="docs-sync/$(date +%Y%m%d)-${GITHUB_SHA::7}"
            git checkout -b "$branch"
            git push origin "$branch"
            gh pr create \
              --title 'docs: sync README.md and CLAUDE.md with the repo' \
              --body-file "$summary" \
              --base main --head "$branch"
          else
            # On a feature branch the update lands in the same PR as the
            # change that caused it. translate-articles may have pushed to this
            # branch meanwhile; replay onto it (the files never overlap).
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
