<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ears: small, set low on the sides -->
  <ellipse cx="6" cy="11.5" rx="3.6" ry="3.3" fill="#6b4428"/>
  <ellipse cx="26" cy="11.5" rx="3.6" ry="3.3" fill="#6b4428"/>
  <ellipse cx="6.4" cy="11.8" rx="1.9" ry="1.7" fill="#f2c9b5"/>
  <ellipse cx="25.6" cy="11.8" rx="1.9" ry="1.7" fill="#f2c9b5"/>
  <!-- head: broad brow tapering to a pointed muzzle -->
  <path d="M16 6.5C23.5 6.5 28 10.5 28 15.5C28 21 21.5 28.5 16 28.5S4 21 4 15.5C4 10.5 8.5 6.5 16 6.5Z" fill="#8b5e3c"/>
  <!-- cream blaze, cheeks and muzzle -->
  <path d="M16 7.5c1.3 0 2 2.5 2 6.5h-4c0-4 .7-6.5 2-6.5Z" fill="#f6ead6"/>
  <path d="M6.5 19C9 17.5 12.5 18 16 18s7-.5 9.5 1C24 23.5 19.5 28 16 28S8 23.5 6.5 19Z" fill="#f6ead6"/>
  <!-- bandit mask band -->
  <path d="M5.5 15.5C7.5 12.5 11 12.6 14 14.3L16 15.6l2-1.3c3-1.7 6.5-1.8 8.5 1.2-1.5 2.5-4.5 3.4-7.5 2.6L16 17.2l-3 .9c-3 .8-6-.1-7.5-2.6Z" fill="#3a2516"/>
  <!-- eyes -->
  <circle cx="11" cy="15.4" r="1.5" fill="#0d0805"/>
  <circle cx="21" cy="15.4" r="1.5" fill="#0d0805"/>
  <circle cx="11.5" cy="14.9" r="0.5" fill="#ffffff"/>
  <circle cx="21.5" cy="14.9" r="0.5" fill="#ffffff"/>
  <!-- nose + mouth -->
  <path d="M14.6 20.6h2.8L16 22.3z" fill="#d98a8a" stroke="#d98a8a" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M16 22.5v.9M16 23.4q-1 .9-2 .3M16 23.4q1 .9 2 .3" fill="none" stroke="#5a3a26" stroke-width="0.6" stroke-linecap="round"/>
  <!-- whisker dots -->
  <g fill="#b89a7e">
    <circle cx="12.6" cy="21.8" r="0.35"/><circle cx="11.6" cy="22.6" r="0.35"/>
    <circle cx="19.4" cy="21.8" r="0.35"/><circle cx="20.4" cy="22.6" r="0.35"/>
  </g>
</svg>
