# Git hooks, installed into .git/hooks by `pnpm lefthook install`
# (run automatically by the `prepare` script on `pnpm install`).
# Skip a run with `git commit --no-verify` or `LEFTHOOK=0 git push`.

pre-commit:
  # piped, not parallel: both jobs rewrite files, so prettier runs after
  # eslint --fix instead of racing it for the same staged files.
  piped: true
  jobs:
    - name: eslint
      glob: '*.{js,mjs,ts,tsx,astro}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      # --fix rewrites files behind git's back, so re-stage what it touched.
      stage_fixed: true
    - name: prettier
      glob: '*.{js,mjs,ts,tsx,astro,css,json,jsonc,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

post-commit:
  jobs:
    # Commit a Korean article with no cardImage and its card thumbnail follows
    # as its own commit, drawn by the Codex CLI from the shared prompt in
    # scripts/card-image-prompt.md. Runs first, so the translation commit that
    # follows already carries the cardImage line. Skip one commit with
    # AUTO_CARD_IMAGE=0.
    - name: auto-card-image
      run: node scripts/auto-card-image.mjs
    # Commit a Korean article and its English version follows as a second
    # commit. The script checks what HEAD touched and what translation-status
    # reports, so a commit with nothing to translate returns instantly. It
    # guards its own translation commit, and rebases/merges, against re-running.
    # Skip one commit with AUTO_TRANSLATE=0.
    - name: auto-translate
      run: node scripts/auto-translate.mjs
    # Change the repo's structure (files, scripts, islands, external hosts)
    # and the README/CLAUDE.md update follows as its own commit. Runs after
    # auto-translate so a translation commit is never interleaved with it.
    # A commit that changes nothing documented costs one scan. Skip one commit
    # with AUTO_SYNC_DOCS=0.
    - name: auto-sync-docs
      run: node scripts/auto-sync-docs.mjs

pre-push:
  jobs:
    # Advisory only — --no-verify skips it, and it matches the branch you're on,
    # not `git push origin HEAD:main`. Branch protection is the real lock.
    - name: no-direct-push-to-main
      only:
        - ref: main
      run: echo '✋ main is protected — push a branch and open a PR'; exit 1
    # Reports articles with no English version, and fails on a translations.en
    # block that points at a missing file or export — which would fail the build
    # below anyway, just slower. A merely untranslated post exits 0: it is a
    # valid state, and the translate-articles workflow fills it in after the push.
    - name: translation-status
      run: node scripts/translation-status.mjs
    # Fails only when a generated block in README.md / CLAUDE.md is stale or
    # its markers are missing — a mechanical fix (pnpm docs:write). Unreviewed
    # drift exits 0, like an untranslated post: the sync-docs workflow reviews
    # it after the push.
    - name: docs-status
      run: node scripts/docs-sync.mjs
    # astro check covers the TypeScript pass, so this is typecheck + build in one.
    - name: build
      run: pnpm build
    - name: test
      run: pnpm test
